<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 - Quyền truy cập bị từ chối</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f7f9fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #333;
    }
    .card {
      background: #ffffff;
      padding: 44px 36px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
      text-align: center;
      max-width: 480px;
      width: 90%;
    }
    .icon-lock {
      font-size: 54px;
      margin-bottom: 8px;
    }
    .status-code {
      font-size: 72px;
      font-weight: 800;
      color: #fa8c16;
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 12px;
      color: #1f1f1f;
      font-weight: 700;
    }
    p {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .notice-box {
      background-color: #fffbe6;
      border: 1px solid #ffe58f;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #d46b08;
      margin-bottom: 24px;
      text-align: left;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-back {
      background-color: #f0f0f0;
      color: #333;
      border-color: #d9d9d9;
    }
    .btn-back:hover {
      background-color: #e4e4e4;
    }
    .btn-home {
      background-color: #1677ff;
      color: #ffffff;
    }
    .btn-home:hover {
      background-color: #0958d9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-lock">🔒</div>
    <div class="status-code">403</div>
    <h1>Truy cập bị từ chối</h1>
    <p>
      Bạn không có quyền xem hoặc chỉnh sửa tài nguyên trên trang này. Hãy kiểm tra lại quyền hạn tài khoản hoặc quay về luồng làm việc an toàn.
    </p>

    <div class="notice-box">
      💡 <strong>Gợi ý:</strong> Nếu bạn cần quyền truy cập chức năng này, vui lòng liên hệ Quản trị viên hệ thống để được phê duyệt.
    </div>

    <div class="btn-group">
      <button class="btn btn-back" onclick="window.history.back()">← Quay lại trang trước</button>
      <a href="index.html" class="btn btn-home">Về trang chủ</a>
    </div>
  </div>
</body>
</html>
